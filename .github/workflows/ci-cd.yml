name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes com Maven
        working-directory: ./spring
        run: mvn test

      - name: Build da imagem Docker
        working-directory: ./spring
        run: docker build -t observability-demo:latest .

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/observability-demo:latest ./spring
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/observability-demo:latest
